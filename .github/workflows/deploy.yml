name: Deploy to Hostinger

# develop -> dev.fisha.shop   |   main -> fisha.shop (live)
on:
  push:
    branches: [main, develop]
    paths:
      - 'wp-content/mu-plugins/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [dev, live]
        default: dev

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'live' || 'dev') }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      LIVE_PATH: ${{ secrets.WP_PATH }}
      DEV_PATH: ${{ secrets.DEV_WP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find wp-content/mu-plugins -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Pick target
        id: cfg
        run: |
          if [ "$TARGET" = "live" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then echo "::error::Live deploys only from main"; exit 1; fi
            P="$LIVE_PATH"
          else
            P="$DEV_PATH"
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$P" ]; then
            echo "::warning::Secrets for '$TARGET' are not set yet - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "path=$P" >> "$GITHUB_OUTPUT"
          fi
          echo "### Target: $TARGET" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "${SSH_PORT:-65002}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            echo "server not answering yet (try $i) - retrying in 10s"; sleep 10
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not reach $SSH_HOST:${SSH_PORT:-65002}"; exit 1; }

      # Only Fisha's own files are touched. Hostinger's own mu-plugins
      # (hostinger-*.php, elementor-safe-mode.php), uploads and plugins are never changed.
      - name: Upload Fisha design code
        if: steps.cfg.outputs.ready == 'true'
        run: |
          SSH="ssh -p ${SSH_PORT:-65002}"
          DEST="$SSH_USER@$SSH_HOST:${{ steps.cfg.outputs.path }}/wp-content/mu-plugins"
          rsync -rlptz --delete --exclude 'tools/' -e "$SSH" \
            wp-content/mu-plugins/fisha-design/ "$DEST/fisha-design/"
          rsync -ptz -e "$SSH" wp-content/mu-plugins/fisha-design.php "$DEST/fisha-design.php"

      - name: Purge cache
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        run: |
          ssh -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" \
            "cd '${{ steps.cfg.outputs.path }}' && (wp litespeed-purge all 2>/dev/null || wp cache flush)"
