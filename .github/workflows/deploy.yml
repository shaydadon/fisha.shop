name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/mu-plugins/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      WP_PATH: ${{ secrets.WP_PATH }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find wp-content/mu-plugins -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check deploy secrets
        id: cfg
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$WP_PATH" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::Deploy secrets are not set yet (SSH_KEY, SSH_HOST, SSH_USER, SSH_PORT, WP_PATH) - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-65002}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Only Fisha's own files are touched. Hostinger's own mu-plugins
      # (hostinger-*.php, elementor-safe-mode.php), uploads and plugins are never changed.
      - name: Upload Fisha design code
        if: steps.cfg.outputs.ready == 'true'
        run: |
          SSH="ssh -p ${SSH_PORT:-65002}"
          DEST="$SSH_USER@$SSH_HOST:$WP_PATH/wp-content/mu-plugins"
          rsync -rlptz --delete --exclude 'tools/' -e "$SSH" \
            wp-content/mu-plugins/fisha-design/ "$DEST/fisha-design/"
          rsync -ptz -e "$SSH" wp-content/mu-plugins/fisha-design.php "$DEST/fisha-design.php"

      - name: Purge cache
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        run: |
          ssh -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" \
            "cd '$WP_PATH' && (wp litespeed-purge all 2>/dev/null || wp cache flush)"
