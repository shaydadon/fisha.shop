upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300

; --- Performance (OPcache was full: 128MB / 4000 files is too small for WP + WooCommerce + Elementor + WooLentor) ---
opcache.enable = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 30000
; the site folder is shared from Windows into the container, where every file check costs ~1ms.
; Don't re-check all ~3,500 cached files per page; docker/dev-prepend.php re-checks only the files we edit.
; (Plugin/theme updates from wp-admin clear the cache themselves.)
opcache.validate_timestamps = 0
auto_prepend_file = /var/www/html/docker/dev-prepend.php
realpath_cache_size = 8M
realpath_cache_ttl = 600
